<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#111">
<title>AR Display Simulator</title>
<script src="https://cdn.jsdelivr.net/npm/three@0.183.2/build/three.min.js"></script>
<script async crossorigin="anonymous" data-preload-chunks="slam"
        src="https://cdn.jsdelivr.net/npm/@8thwall/engine-binary@1/dist/xr.js"></script>
<link rel="stylesheet" href="./src/style.css">
</head>
<body>
<canvas id="camerafeed"></canvas>
<div id="topbar"><strong>AR Display Simulator</strong><span id="status">Engine loading…</span></div>
<div id="hint">Tap START AR. Allow camera access.</div>
<section id="panel">
 <div class="row">
  <button id="startAR">START AR</button>
  <button id="add">+ ADD DISPLAY</button>
  <button id="delete" disabled>DELETE #—</button>
  <button id="screenshot">SCREENSHOT</button>
  <button id="save">SAVE</button><button id="load">LOAD</button><button id="recenter">RECENTER</button>
 </div>
 <div class="row">
  <label>UNIT <select id="unit"><option value="mm">mm</option><option value="inch">inch</option></select></label>
  <label id="mmWidthWrap">WIDTH <input id="mmWidth" type="number" min="10" step="1" value="1200"></label>
  <label id="mmHeightWrap">HEIGHT <input id="mmHeight" type="number" min="10" step="1" value="675"></label>
  <label id="inchWrap" hidden>DISPLAY SIZE
   <select id="inchSize">
    <option value="21.5">21.5"</option><option value="23">23"</option><option value="24">24"</option>
    <option value="27">27"</option><option value="32">32"</option><option value="43">43"</option>
    <option value="55">55"</option><option value="65">65"</option><option value="75">75"</option>
    <option value="custom">Custom</option>
   </select>
  </label>
  <label id="customInchWrap" hidden>DIAGONAL <input id="customInch" type="number" min="1" step=".1" value="27"></label>
  <label>RATIO <select id="ratio"><option>16:9</option><option>3:4</option><option>3:2</option><option>Custom</option></select></label>
  <button id="sizeToggle">SIZE: ON</button><button id="bezelToggle">BEZEL: 5 mm</button>
 </div>
 <div class="row info"><span id="selected">Selected: none</span><span id="heightInfo">Height above floor: —</span><span id="tracking">Tracking: —</span></div>
</section>
<div id="message"></div>
<script src="./src/app.js"></script>
</body>
</html>
