<!doctype html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
  <meta name="theme-color" content="#111">
  <title>AR Display Simulator</title>
  <link rel="stylesheet" href="./src/style.css">
</head>
<body>
  <main id="app">
    <header>
      <strong>AR Display Simulator</strong>
      <span id="status">カメラ未起動</span>
    </header>

    <section id="controls">
      <div class="row">
        <button id="start">AR開始</button>
        <button id="add">＋ ディスプレイ</button>
        <button id="shot">スクショ</button>
        <button id="save">配置保存</button>
        <button id="load">配置読込</button>
      </div>
      <div class="row">
        <label>比率
          <select id="ratio">
            <option value="16:9">16:9</option>
            <option value="3:4">3:4</option>
            <option value="3:2">3:2</option>
            <option value="custom">自由</option>
          </select>
        </label>
        <label>幅 mm <input id="width" type="number" value="1200" min="50" step="10"></label>
        <label id="heightWrap">高さ mm <input id="height" type="number" value="675" min="50" step="10"></label>
        <button id="sizeToggle">サイズ表示 ON</button>
        <button id="bezelToggle">ベゼル 5mm</button>
      </div>
      <div class="row small">
        <span id="selected">選択なし</span>
        <span id="floorHeight">床高さ: —</span>
      </div>
    </section>

    <video id="camera" autoplay playsinline muted></video>
    <canvas id="canvas"></canvas>
    <div id="sceneHint">AR開始後、画面をタップしてディスプレイを配置</div>
  </main>
  <script type="module" src="./src/app.js"></script>
</body>
</html>
